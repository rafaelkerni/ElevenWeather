name: Release

# Disparo manual (Actions -> Release -> Run workflow). A versão vem da <Version> do csproj.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          Write-Error "Releases só podem ser publicadas a partir da branch main (atual: ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/ElevenWeather/ElevenWeather.csproj
          $version = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Versão inválida no csproj: '$version'. Use o formato X.Y.Z (ex.: 0.1.0)."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure release does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "A release v${{ steps.version.outputs.version }} já existe. Altere a <Version> no csproj antes de publicar."
            exit 1
          }
          # O código 1 do gh (release inexistente) é o caso esperado, não uma falha do passo
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/ElevenWeather
          --configuration Release
          --runtime win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          --output publish

      # Nome fixo, sem versão: o auto-update substitui o arquivo no lugar e o link releases/latest/download não muda
      - name: Compute hash
        shell: pwsh
        run: |
          # Hash usado pelo auto-update para validar o download (formato do sha256sum)
          $hash = (Get-FileHash publish/ElevenWeather.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ElevenWeather.exe" | Out-File -FilePath publish/ElevenWeather.exe.sha256 -Encoding ascii -NoNewline

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          publish/ElevenWeather.exe
          publish/ElevenWeather.exe.sha256
          --target ${{ github.sha }}
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
